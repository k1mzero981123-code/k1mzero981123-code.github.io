<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- 로그인 배경 — 파스텔 일러스트. 태양광 언덕 아래 피크닉, 물방울 캐릭터(방울)와 해 캐릭터(해님). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0ff"/><stop offset=".7" stop-color="#e6f4ff"/><stop offset="1" stop-color="#f4fbff"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdebc3"/><stop offset="1" stop-color="#b6dfa9"/></linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9e2aa"/><stop offset="1" stop-color="#9fd48f"/></linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6d996"/><stop offset="1" stop-color="#8cc97c"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9dc2ea"/><stop offset="1" stop-color="#6f9fd6"/></linearGradient>
    <radialGradient id="sunBody" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#fff3c4"/><stop offset=".55" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffc85c"/></radialGradient>
    <radialGradient id="dropBody" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#e3f4ff"/><stop offset=".5" stop-color="#a9d8ff"/><stop offset="1" stop-color="#6fb6f0"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2b0" stop-opacity=".9"/><stop offset="1" stop-color="#fff2b0" stop-opacity="0"/></radialGradient>
    <pattern id="check" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="skewX(-28) scale(1,.55)">
      <rect width="44" height="44" fill="#fff5f2"/><rect width="22" height="22" fill="#ffb8b0"/><rect x="22" y="22" width="22" height="22" fill="#ffb8b0"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2b5a3a" flood-opacity=".18"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- 구름 — 동글동글 파스텔 -->
  <g fill="#ffffff" opacity=".92">
    <g transform="translate(1080 120)"><ellipse cx="0" cy="20" rx="120" ry="34"/><circle cx="-50" cy="0" r="40"/><circle cx="10" cy="-14" r="50"/><circle cx="70" cy="4" r="38"/></g>
    <g transform="translate(1400 230) scale(.75)"><ellipse cx="0" cy="20" rx="120" ry="34"/><circle cx="-50" cy="0" r="40"/><circle cx="10" cy="-14" r="50"/><circle cx="70" cy="4" r="38"/></g>
    <g transform="translate(560 170) scale(.6)"><ellipse cx="0" cy="20" rx="120" ry="34"/><circle cx="-50" cy="0" r="40"/><circle cx="10" cy="-14" r="50"/><circle cx="70" cy="4" r="38"/></g>
    <g transform="translate(720 330) scale(.5)"><ellipse cx="0" cy="20" rx="120" ry="34"/><circle cx="-50" cy="0" r="40"/><circle cx="10" cy="-14" r="50"/><circle cx="70" cy="4" r="38"/></g>
  </g>

  <!-- 해님 — 왼쪽 위, 윙크 -->
  <g transform="translate(250 190)">
    <circle r="170" fill="url(#glow)"/>
    <g fill="#ffd77a" opacity=".95">
      <g id="ray"><rect x="-13" y="-140" width="26" height="46" rx="13"/></g>
      <use href="#ray" transform="rotate(30)"/><use href="#ray" transform="rotate(60)"/><use href="#ray" transform="rotate(90)"/>
      <use href="#ray" transform="rotate(120)"/><use href="#ray" transform="rotate(150)"/><use href="#ray" transform="rotate(180)"/>
      <use href="#ray" transform="rotate(210)"/><use href="#ray" transform="rotate(240)"/><use href="#ray" transform="rotate(270)"/>
      <use href="#ray" transform="rotate(300)"/><use href="#ray" transform="rotate(330)"/>
    </g>
    <circle r="88" fill="url(#sunBody)"/>
    <!-- 얼굴 -->
    <ellipse cx="-30" cy="-6" rx="8" ry="11" fill="#3b2f2f"/><circle cx="-27" cy="-10" r="3" fill="#fff"/>
    <path d="M18 -8 q14 -12 28 0" fill="none" stroke="#3b2f2f" stroke-width="5" stroke-linecap="round"/>
    <path d="M-14 24 q14 16 30 0" fill="none" stroke="#3b2f2f" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-52" cy="20" r="12" fill="#ffb1b1" opacity=".75"/><circle cx="52" cy="20" r="12" fill="#ffb1b1" opacity=".75"/>
  </g>

  <!-- 언덕 -->
  <path d="M0 520 C 250 440, 520 470, 780 500 S 1300 430, 1600 480 L1600 900 L0 900 Z" fill="url(#hillBack)"/>
  <!-- 뒷언덕 태양광 패널 줄 -->
  <g>
    <g id="pv">
      <rect x="-2" y="0" width="4" height="26" fill="#9aa9b8"/>
      <g transform="skewX(-18)"><rect x="-38" y="-30" width="76" height="34" rx="4" fill="url(#panel)"/>
        <path d="M-38 -19 h76 M-38 -8 h76 M-19 -30 v34 M0 -30 v34 M19 -30 v34" stroke="#d6e7f7" stroke-width="1.5" opacity=".8"/></g>
    </g>
    <use href="#pv" transform="translate(900 512) scale(1.05)"/><use href="#pv" transform="translate(1000 500) scale(1.08)"/>
    <use href="#pv" transform="translate(1100 490) scale(1.1)"/><use href="#pv" transform="translate(1200 482) scale(1.12)"/>
    <use href="#pv" transform="translate(1300 478) scale(1.14)"/><use href="#pv" transform="translate(1400 480) scale(1.16)"/>
    <use href="#pv" transform="translate(1500 486) scale(1.18)"/>
    <use href="#pv" transform="translate(120 530) scale(.9)"/><use href="#pv" transform="translate(210 518) scale(.92)"/>
    <use href="#pv" transform="translate(300 510) scale(.94)"/><use href="#pv" transform="translate(390 508) scale(.96)"/>
  </g>
  <path d="M0 640 C 300 580, 700 620, 1000 600 S 1450 560, 1600 610 L1600 900 L0 900 Z" fill="url(#hillMid)"/>
  <path d="M0 760 C 300 700, 600 760, 900 730 S 1400 690, 1600 740 L1600 900 L0 900 Z" fill="url(#hillFront)"/>

  <!-- 나무 두 그루 -->
  <g transform="translate(1440 560)"><rect x="-7" y="0" width="14" height="70" rx="6" fill="#c69a6a"/><circle cy="-20" r="52" fill="#9bd68b"/><circle cx="-34" cy="6" r="34" fill="#a9de99"/><circle cx="34" cy="8" r="34" fill="#8fce80"/></g>
  <g transform="translate(90 620) scale(.8)"><rect x="-7" y="0" width="14" height="70" rx="6" fill="#c69a6a"/><circle cy="-20" r="52" fill="#9bd68b"/><circle cx="-34" cy="6" r="34" fill="#a9de99"/><circle cx="34" cy="8" r="34" fill="#8fce80"/></g>

  <!-- 피크닉 담요 + 바구니 (왼쪽 아래) -->
  <g transform="translate(330 770)">
    <ellipse cx="0" cy="40" rx="260" ry="34" fill="#3d7a4a" opacity=".12" filter="url(#soft)"/>
    <path d="M-250 30 L-150 -60 L250 -60 L200 40 Z" fill="url(#check)" stroke="#ffd9d4" stroke-width="3" stroke-linejoin="round"/>
    <!-- 바구니 -->
    <g transform="translate(150 -30)">
      <path d="M-42 -10 h84 l-10 44 h-64 Z" fill="#e8c493"/><path d="M-42 -10 h84 l-4 12 h-76 Z" fill="#d9ae76"/>
      <path d="M-24 -10 q24 -44 48 0" fill="none" stroke="#c99a62" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-8" cy="-16" r="9" fill="#ff8f8f"/><circle cx="12" cy="-20" r="9" fill="#ffb84d"/>
    </g>
    <!-- 컵 두 개 -->
    <g transform="translate(-140 -10)"><rect x="-10" y="-22" width="20" height="26" rx="4" fill="#fff"/><rect x="-10" y="-22" width="20" height="8" rx="3" fill="#ffcf8a"/></g>
    <g transform="translate(-105 -2)"><rect x="-10" y="-22" width="20" height="26" rx="4" fill="#fff"/><rect x="-10" y="-22" width="20" height="8" rx="3" fill="#a9d8ff"/></g>
  </g>

  <!-- 방울 — 담요 위에 앉아 손 흔드는 물방울 -->
  <g transform="translate(320 660)" filter="url(#shadow)">
    <!-- 팔(흔드는 손) -->
    <path d="M58 20 q40 -30 46 -70" fill="none" stroke="#8ec8f6" stroke-width="20" stroke-linecap="round"/>
    <circle cx="106" cy="-54" r="14" fill="#b9e0ff"/>
    <!-- 몸통 -->
    <path d="M0 -118 C 42 -66 78 -32 78 20 A78 78 0 1 1 -78 20 C -78 -32 -42 -66 0 -118 Z" fill="url(#dropBody)"/>
    <ellipse cx="-30" cy="-30" rx="14" ry="26" transform="rotate(20 -30 -30)" fill="#fff" opacity=".6"/>
    <!-- 다른 팔 -->
    <path d="M-70 40 q-30 20 -50 12" fill="none" stroke="#8ec8f6" stroke-width="20" stroke-linecap="round"/>
    <!-- 얼굴 -->
    <ellipse cx="-24" cy="10" rx="9" ry="13" fill="#3b2f2f"/><circle cx="-21" cy="5" r="3.5" fill="#fff"/>
    <ellipse cx="26" cy="10" rx="9" ry="13" fill="#3b2f2f"/><circle cx="29" cy="5" r="3.5" fill="#fff"/>
    <path d="M-14 40 q14 18 30 0" fill="#3b2f2f"/><path d="M-6 44 q8 8 16 0" fill="#ff8a8a"/>
    <circle cx="-48" cy="30" r="12" fill="#ffb1b1" opacity=".8"/><circle cx="50" cy="30" r="12" fill="#ffb1b1" opacity=".8"/>
    <!-- 발 -->
    <ellipse cx="-36" cy="96" rx="22" ry="12" fill="#8ec8f6"/><ellipse cx="36" cy="96" rx="22" ry="12" fill="#8ec8f6"/>
  </g>

  <!-- 새싹이 — 오른쪽 아래, 작은 새싹 캐릭터 -->
  <g transform="translate(1290 740)" filter="url(#shadow)">
    <path d="M0 -60 q-40 -30 -30 -70 q36 6 30 70 M0 -60 q40 -30 30 -70 q-36 6 -30 70" fill="#9fdc8f"/>
    <rect x="-4" y="-66" width="8" height="30" rx="4" fill="#7cc46c"/>
    <circle r="56" fill="#c8ecb8"/>
    <ellipse cx="-18" cy="-2" rx="7" ry="10" fill="#3b2f2f"/><circle cx="-16" cy="-6" r="2.6" fill="#fff"/>
    <ellipse cx="18" cy="-2" rx="7" ry="10" fill="#3b2f2f"/><circle cx="20" cy="-6" r="2.6" fill="#fff"/>
    <path d="M-10 20 q10 12 20 0" fill="none" stroke="#3b2f2f" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-34" cy="14" r="9" fill="#ffb1b1" opacity=".8"/><circle cx="34" cy="14" r="9" fill="#ffb1b1" opacity=".8"/>
    <ellipse cx="-24" cy="60" rx="16" ry="9" fill="#a9d999"/><ellipse cx="24" cy="60" rx="16" ry="9" fill="#a9d999"/>
  </g>

  <!-- 잔디 포인트 -->
  <g stroke="#7fbf6e" stroke-width="4" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M700 820 q4 -16 8 0 M712 824 q4 -14 8 0"/><path d="M1000 850 q4 -16 8 0 M1012 854 q4 -14 8 0"/><path d="M150 870 q4 -16 8 0 M162 874 q4 -14 8 0"/>
  </g>
</svg>
